name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: '3.12'

    - name: Install ruff
      run: pip install ruff

    - name: Lint with ruff
      run: ruff check . --select E,F,W --ignore E501

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Project dependencies and Docker image require Python 3.12+.
        python-version: ['3.12']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run tests
      run: python -m pytest tests/ -v

    - name: Train model (full pipeline)
      run: python -m model.train

    - name: Upload model artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: model-artifact
        path: model/artifacts/model.json
        retention-days: 30

    - name: Run pinned historical holdout benchmark
      run: python -m model.benchmark

    - name: Upload historical benchmark evidence
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: historical-benchmark
        path: benchmark-results/
        retention-days: 30

    - name: Verify prediction functions
      run: |
        python -c "from model.predict import predict_game, get_default_stats, predict_with_confidence; stats = get_default_stats(); h_prob, a_prob = predict_game(stats, stats); print(f'Prediction: Home {h_prob:.1%}, Away {a_prob:.1%}')"

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Build Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        push: false
        tags: sports-betting-ml:latest
